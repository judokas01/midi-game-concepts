<svg xmlns="http://www.w3.org/2000/svg" width="120" height="124" viewBox="0 0 120 124">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6e3c"/>
      <stop offset="0.5" stop-color="#7a512d"/>
      <stop offset="1" stop-color="#5a391d"/>
    </linearGradient>
  </defs>
  <!-- soft shadow under the board -->
  <rect x="4" y="8" width="112" height="114" rx="12" fill="#000" opacity="0.3"/>
  <rect x="1" y="2" width="118" height="118" rx="11" fill="#3f2713"/>
  <!-- the wooden frame -->
  <rect x="1" y="1" width="118" height="116" rx="11" fill="url(#frame)"/>
  <rect x="2.5" y="2.5" width="115" height="113" rx="10" fill="none" stroke="#f0cf94" stroke-width="1.2" opacity="0.4"/>
  <!-- the dark panel inside it -->
  <rect x="13" y="13" width="94" height="92" rx="6" fill="#16100a" opacity="0.92"/>
  <rect x="13" y="13" width="94" height="92" rx="6" fill="none" stroke="#2e1d0e" stroke-width="2"/>
  <path d="M 19 104.2 H 101" stroke="#c0904f" stroke-width="1" opacity="0.35"/>
  <!-- nail heads in the corners -->
  <circle cx="7" cy="7" r="1.8" fill="#3a2a1a"/>
  <circle cx="113" cy="7" r="1.8" fill="#3a2a1a"/>
  <circle cx="7" cy="111" r="1.8" fill="#3a2a1a"/>
  <circle cx="113" cy="111" r="1.8" fill="#3a2a1a"/>
</svg>
